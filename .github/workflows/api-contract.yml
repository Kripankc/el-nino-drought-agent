name: API contract check
on:
  schedule:
    - cron: "41 7 * * 1"   # weekly
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python pipeline/check_apis.py
