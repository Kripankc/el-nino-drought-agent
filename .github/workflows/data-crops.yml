name: Build crop data
on:
  workflow_dispatch:   # run once, then only when CROPGRIDS or GGCMI release new versions
permissions:
  contents: write
jobs:
  crops:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r pipeline/requirements.txt
      - run: pytest -q pipeline/tests
      - run: python pipeline/crops.py --work "$RUNNER_TEMP/cropwork" --out public/data/crops
      - run: du -sh public/data/crops && ls public/data/crops | wc -l
      - name: Commit crop tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/crops
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "data: build crop area and calendar tiles (CROPGRIDS v1.08, GGCMI phase 3)"
          git push
