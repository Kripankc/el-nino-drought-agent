<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENSOwatch · Climate, crops and El Niño for any farm</title>
  <meta name="description" content="Season rainfall against crop water need, heat, soil moisture, 15-day and 7-month forecasts and El Niño history for any farm location. Open data from ERA5, ECMWF, NOAA CPC, CROPGRIDS, GGCMI and FAO-56." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="ENSOwatch home">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M4 15.5c1.4 0 1.4-1.3 2.8-1.3s1.4 1.3 2.8 1.3 1.4-1.3 2.8-1.3 1.4 1.3 2.8 1.3 1.4-1.3 2.8-1.3 1.4 1.3 1.8 1.3M12 13V7.5m0 1.5c.3-1.8 1.8-3 3.8-3-.2 1.9-1.7 3-3.8 3z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ENSOwatch</span>
    </a>
    <form class="search" id="search" autocomplete="off" role="search">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search a place, or click the map" aria-label="Search a place" />
      <ul id="results" role="listbox"></ul>
    </form>
    <label class="datefield" title="Look at a past date">
      <span class="sr">Date</span>
      <input id="date" type="date" min="1950-01-01" />
    </label>
    <a class="toplink" href="methods.html">Methods</a>
  </header>

  <div class="app" id="app">
    <aside class="panel" id="panel">
      <div class="status" id="status" aria-live="polite" hidden></div>
      <main id="report"></main>
    </aside>
    <div class="gutter gutter-v" id="gutter-v" role="separator" aria-orientation="vertical" aria-label="Resize side panel" tabindex="0"></div>
    <div class="right" id="right">
      <div class="mapwrap">
        <div id="map" role="application" aria-label="Map. Click to choose a location."></div>
        <div class="layers" role="group" aria-label="Base map">
          <button type="button" data-layer="map" aria-pressed="true">Map</button>
          <button type="button" data-layer="sat" aria-pressed="false">Satellite</button>
        </div>
      </div>
      <div class="gutter gutter-h" id="gutter-h" role="separator" aria-orientation="horizontal" aria-label="Resize map" tabindex="0"></div>
      <section class="details" id="details" aria-label="Details"></section>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
